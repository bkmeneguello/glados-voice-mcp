name: Publish

# Trusted Publishing (OIDC): no API tokens are stored. Configure the publisher on PyPI and TestPyPI with
#   owner bkmeneguello, repository glados-voice-mcp, workflow publish.yml,
#   environment pypi (PyPI) and testpypi (TestPyPI).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive # the upstream glados package is a git submodule
          fetch-depth: 0 # the tag check below needs origin/main
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Check the tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject version v$version"; exit 1; }
      - name: Use a unique dev version for TestPyPI runs
        # TestPyPI never accepts a file name twice, so every manual run gets its own
        # version, for example 0.1.0.dev20261031175340. Install it with --prerelease allow.
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'EOF'
          import os, re, time
          sha = os.environ["GITHUB_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          text = open("pyproject.toml").read()
          base = re.search(r'^version = "([^"]+)"', text, re.M).group(1)
          version = base + ".dev" + time.strftime("%Y%m%d%H%M%S", time.gmtime())
          text = re.sub(r'^version = "[^"]+"', 'version = "' + version + '"', text, count=1, flags=re.M)
          commit_url = "https://github.com/" + repo + "/commit/" + sha
          text = text.replace("[project.urls]\n", '[project.urls]\nCommit = "' + commit_url + '"\n', 1)
          open("pyproject.toml", "w").write(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("TestPyPI version `" + version + "` built from commit `" + sha[:7] + "`\n")
          EOF
      - run: uv build
      - name: Check the wheel contents
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for required in ("glados_voice/_glados/tts.py", "glados_voice/_glados/models/phoneme_to_id.pkl", "glados_voice/mcp_server.py"):
              assert required in names, f"missing {required} in the wheel"
          assert not any(n.startswith("glados/") for n in names), "top-level glados package must not ship"
          assert any(n.endswith("licenses/NOTICE.md") for n in names), "NOTICE.md missing from the wheel"
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-testpypi:
    # Manual runs only: Actions > Publish > Run workflow.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/glados-voice-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    # Version tags only (for example v0.1.1).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/glados-voice-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
