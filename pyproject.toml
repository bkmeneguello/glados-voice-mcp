[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glados-voice-mcp"
version = "0.1.0"
description = "Warm, shared GLaDOS text-to-speech server with an MCP interface for agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Bruno Meneguello" }]
keywords = ["mcp", "model-context-protocol", "tts", "text-to-speech", "glados", "voice", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy",
    "sounddevice",
    "num2words",
    "platformdirs",
    "mcp>=2",
]

# onnxruntime and onnxruntime-gpu conflict, so exactly one extra must be chosen.
[project.optional-dependencies]
cpu = ["onnxruntime"]
cuda = [
    "onnxruntime-gpu>=1.31.1,<2",
    "nvidia-cuda-runtime",
    "nvidia-cublas",
    "nvidia-cudnn-cu13",
    "nvidia-cufft",
    "nvidia-curand",
]

[project.urls]
Homepage = "https://github.com/bkmeneguello/glados-voice-mcp"
Repository = "https://github.com/bkmeneguello/glados-voice-mcp"
Issues = "https://github.com/bkmeneguello/glados-voice-mcp/issues"

[project.scripts]
glados-voice = "glados_voice.cli:main"
glados-voice-mcp = "glados_voice.mcp_server:main"
glados-voice-daemon = "glados_voice.daemon:main"

# The upstream `glados` package (git submodule) is installed unmodified under a private name,
# `glados_voice._glados`, so it cannot clash with the unrelated `glados` project on PyPI.
[tool.setuptools]
packages = ["glados_voice", "glados_voice._glados"]

[tool.setuptools.package-dir]
glados_voice = "src/glados_voice"
"glados_voice._glados" = "third_party/GLaDOS-TTS/glados"

[tool.setuptools.package-data]
"glados_voice._glados" = ["models/*.pkl", "models/*.json"]
